<!-- ── MY SHIFT ── -->
<div class="tab" id="tab-myshift">
  <div class="page-title" id="pageTitleMyShift">My Shift</div>
  <div id="myShiftContent"></div>
  <!-- Save bar visible on My Shift (schedule bar is inside hidden schedule tab) -->
  <div id="schedSaveBarMyShift" style="display:none;position:sticky;bottom:0;left:0;right:0;
    background:linear-gradient(135deg,#0d2a1a,#0a1f14);
    border-top:2px solid rgba(34,197,94,.4);
    padding:14px 16px;margin:12px -4px 0;
    box-shadow:0 -6px 24px rgba(0,0,0,.5);z-index:95">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:14px;font-weight:900;color:var(--green)" id="saveBarTitleMy">📝 Changes pending</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:2px" id="saveBarSubMy"></div>
      </div>
      <button type="button" onclick="discardAllShiftChanges()" style="padding:7px 12px;border-radius:8px;border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.08);color:var(--lv);font-size:12px;font-weight:700;cursor:pointer">Discard</button>
    </div>
    <div id="saveBarListMy" style="font-size:12px;color:var(--muted2);margin-bottom:10px;max-height:80px;overflow:auto"></div>
    <button type="button" onclick="saveAllShiftChanges({stayOnMyShift:true})" style="width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:15px;font-weight:900;cursor:pointer">💾 Save &amp; WhatsApp</button>
  </div>
</div>
