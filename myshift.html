<!-- ── MY SHIFT ── -->
<div class="tab" id="tab-myshift">
  <div class="page-title" id="pageTitleMyShift">My Shift</div>
  <div id="myShiftContent"></div>
  <!-- Save bar visible on My Shift (schedule bar is inside hidden schedule tab) -->
  <div id="schedSaveBarMyShift" class="shift-save-bar" style="display:none">
    <div class="shift-save-head">
      <div>
        <div class="shift-save-title" id="saveBarTitleMy">📝 Changes pending</div>
        <div class="shift-save-sub" id="saveBarSubMy"></div>
      </div>
      <button type="button" class="shift-save-cancel" onclick="discardAllShiftChanges()">✕ Cancel</button>
    </div>
    <div class="shift-save-list" id="saveBarListMy"></div>
    <button type="button" class="shift-save-submit" onclick="saveAllShiftChanges({stayOnMyShift:true})">💾 Save</button>
  </div>
</div>
