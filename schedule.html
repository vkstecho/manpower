<!-- ── SCHEDULE ── -->
<div class="tab" id="tab-schedule">
  <div class="sched-nav">
    <button class="nav-btn" onclick="moveW(-7)">‹</button>
    <div class="sched-lbl" id="schedLbl"></div>
    <button class="nav-btn" onclick="moveW(7)">›</button>
  </div>
  <!-- Admin-only action row (shown via JS) -->
  <div class="sched-admin-row" id="schedAdminRow" style="display:none">
    <button id="schedBuildBtn" onclick="openScheduleBuilder()" class="sched-admin-btn green">📋 Schedule बनाएं</button>
    <button id="printBtn" onclick="printSched()" class="sched-admin-btn">🖨️ प्रिंट</button>
    <button id="excelBtn" onclick="exportSchedExcel()" class="sched-admin-btn" style="border-color:rgba(34,197,94,.5);color:#22c55e;background:rgba(34,197,94,.07)">📊 Excel</button>
    <button id="msToggleBtn" onclick="toggleSelectMode()" class="sched-admin-btn" style="border-color:rgba(167,139,250,.4);color:#a78bfa;background:rgba(167,139,250,.06)">☑️ Multi-Select</button>
    <button id="empReorderBtn" onclick="openEmpReorderPanel()" class="sched-admin-btn" style="border-color:rgba(168,85,247,.4);color:#c084fc;background:rgba(168,85,247,.08)">↕️ क्रम बदलें</button>
  </div>
  <!-- Custom date range row -->
  <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
    <button id="customRangeBtn" onclick="openCustomRange()" class="act-btn edit" style="flex:1;padding:10px 8px;border-radius:10px;font-size:13px;min-height:40px">🗓️ कस्टम तारीख चुनें</button>
    <button id="resetRangeBtn" onclick="resetCustomRange()" style="display:none;padding:10px 12px;border-radius:10px;border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.08);color:var(--lv);font-size:13px;cursor:pointer;min-height:40px">✕ Reset</button>
  </div>
  <div class="sched-sticky-hdr" id="schedStickyHdr">
    <div class="chips" id="schedFilter">
    <div class="chip on" onclick="setSchedSec('ALL',this)" data-i18n-all>सभी</div>
    <div class="chip" onclick="setSchedSec('M12',this)">M-1&2</div>
    <div class="chip" onclick="setSchedSec('S12',this)">S-1&2</div>
    <div class="chip" onclick="setSchedSec('SUP',this)">Supervisor</div>
    <div class="chip" onclick="setSchedSec('MGR',this)">Manager</div>
  </div>
    <!-- Sticky date row that scrolls in sync with table -->
    <div id="schedDateHdrWrap" style="overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;margin:0 -16px;padding:0 16px">
      <div id="schedHdrStack" style="display:flex;flex-direction:column;min-width:580px">
        <div id="schedMonthHdr" style="display:flex;background:#0a1628;border-top:1px solid var(--border2);border-bottom:1px solid var(--border)"></div>
        <div id="schedDateHdr" style="display:flex;background:var(--card2);border-bottom:2px solid var(--border2)"></div>
      </div>
    </div>
  </div><!-- end sched-sticky-hdr -->
  <div class="sched-wrap" id="schedWrap"><table class="sched-tbl" id="schedTbl"></table></div>
  <!-- Day strip + legend shown below table -->
  <div style="margin-top:10px">
    <div class="legend" id="schedLegend"></div>
  </div>

  <!-- ══ SHIFT TRENDS SECTION ══ -->
  <div id="shiftTrendsSection" style="margin-top:16px">
    <!-- Rendered by renderShiftTrends() after renderSchedule() -->
  </div>

  <!-- ══ MULTI-CELL SELECT BAR ══ -->
  <div id="multiSelectBar">
    <span class="ms-count" id="msCount">0 cells</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center">
      <button class="ms-btn" style="background:#f59e0b;color:#000" onclick="applyMultiShift('D')">D</button>
      <button class="ms-btn" style="background:#4f46e5;color:#fff" onclick="applyMultiShift('N')">N</button>
      <button class="ms-btn" style="background:#16a34a;color:#fff" onclick="applyMultiShift('A')">A</button>
      <button class="ms-btn" style="background:#db2777;color:#fff" onclick="applyMultiShift('B')">B</button>
      <button class="ms-btn" style="background:#0891b2;color:#fff" onclick="applyMultiShift('C')">C</button>
      <button class="ms-btn" style="background:#334155;color:#94a3b8" onclick="applyMultiShift('O')">O</button>
      <button class="ms-btn" style="background:#be123c;color:#fda4af" onclick="applyMultiShift('L')">L</button>
      <button class="ms-btn" style="background:#0c4a6e;color:#7dd3fc" onclick="applyMultiShift('G')">G</button>
      <button class="ms-btn" style="background:#713f12;color:#fde68a" onclick="applyMultiShift('C/O')" style="font-size:10px">CO</button>
      <button class="ms-btn" style="background:#f97316;color:#fff" onclick="applyMultiShift('HLF')">½</button>
      <button class="ms-btn" style="background:#7f1d1d;color:#fca5a5" onclick="applyMultiShift('Ab')" style="font-size:10px">Ab</button>
      <button class="ms-btn" style="background:#ea580c;color:#fff" onclick="applyMultiShift('H')">H</button>
    </div>
    <button class="ms-cancel" onclick="clearMultiSelect()">✕ रद्द करें · Cancel</button>
  </div>

  <!-- ══ PENDING CHANGES SAVE BAR ══ -->
  <div id="schedSaveBar" style="display:none;position:sticky;bottom:0;left:0;right:0;
    background:linear-gradient(135deg,#0d2a1a,#0a1f14);
    border-top:2px solid rgba(34,197,94,.4);
    padding:14px 16px;margin:0 -16px;
    box-shadow:0 -6px 24px rgba(0,0,0,.5);z-index:95">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:14px;font-weight:900;color:var(--green)" id="saveBarTitle">📝 बदलाव pending हैं</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:2px" id="saveBarSub"></div>
      </div>
      <button onclick="discardAllShiftChanges()" style="padding:7px 12px;border-radius:8px;border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.08);color:var(--lv);font-size:12px;font-weight:700;cursor:pointer">
        ✕ रद्द करें
      </button>
    </div>
    <!-- Pending changes list -->
    <div id="saveBarList" style="max-height:120px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:6px"></div>
    <!-- Save button -->
    <button onclick="saveAllShiftChanges()" style="width:100%;padding:16px;border-radius:13px;border:none;
      background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;
      font-family:'Noto Sans Devanagari',sans-serif;font-size:17px;font-weight:900;
      cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.4);
      display:flex;align-items:center;justify-content:center;gap:10px">
      💾 Save करें
    </button>
  </div>
</div>
