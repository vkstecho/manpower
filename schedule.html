<!-- ── SCHEDULE ── -->
<div class="tab" id="tab-schedule">
  <div class="sched-toolbar-top">
    <!-- View/Edit: only for Admin/Manager or schedule-permission; hidden for normal members via _updateSchedAdminVisibility -->
    <!-- View/Edit removed: managers always edit schedule directly -->
    <div class="sch-mode-toggle" id="schModeToggle" role="group" aria-label="Schedule mode" style="display:none">
      <button type="button" id="schModeView" onclick="setSchedEditMode(false)">👁️ View</button>
      <button type="button" class="on" id="schModeEdit" onclick="setSchedEditMode(true)">✏️ Edit</button>
    </div>
    <div class="sched-nav" style="flex:1;justify-content:center">
      <button class="nav-btn" onclick="moveW(-7)" aria-label="Previous">‹</button>
      <div class="sched-lbl" id="schedLbl"></div>
      <button class="nav-btn" onclick="moveW(7)" aria-label="Next">›</button>
    </div>
    <button id="customRangeBtn" onclick="openCustomRange()" class="act-btn edit" title="Custom date range"
      style="padding:8px 12px;border-radius:10px;font-size:12px;min-height:36px;font-weight:700">🗓️</button>
    <button id="resetRangeBtn" onclick="resetCustomRange()" style="display:none;padding:8px 12px;border-radius:10px;border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.08);color:var(--lv);font-size:12px;cursor:pointer;min-height:36px;font-weight:700">✕</button>
  </div>

  <div id="schedEditHint" class="sched-edit-hint" style="display:none"></div>

  <!-- Admin toolbar: primary actions + More -->
  <div class="sched-admin-row sched-admin-toolbar" id="schedAdminRow" style="display:none">
    <button type="button" id="schedBuildBtn" onclick="openScheduleBuilder()" class="sched-admin-btn green" aria-label="Auto Create Schedule">📋 Auto Create Schedule</button>
    <button id="uploadSchedBtn" onclick="openExcelUpload()" class="sched-admin-btn blue">📤 Upload</button>
    <button id="printBtn" onclick="printSched()" class="sched-admin-btn">🖨️ Print</button>
    <button id="excelBtn" onclick="exportSchedExcel()" class="sched-admin-btn" style="border-color:rgba(34,197,94,.5);color:#22c55e;background:rgba(34,197,94,.07)">📊 Excel</button>
    <div class="sched-more-wrap">
      <button type="button" class="sched-admin-btn" id="schedMoreBtn" onclick="toggleSchedMoreMenu()">⋯ More</button>
      <div id="schedMoreMenu" class="sched-more-menu" style="display:none">
        <button type="button" id="msToggleBtn" onclick="closeSchedMoreMenu();toggleSelectMode()">☑️ Multi-Select</button>
        <button type="button" id="empReorderBtn" onclick="closeSchedMoreMenu();openEmpReorderPanel()">↕️ Reorder</button>
      </div>
    </div>
  </div>
  <div id="customRangeRow" style="display:none"></div>
  <div class="sched-sticky-hdr" id="schedStickyHdr">
    <div class="chips" id="schedFilter">
      <div class="chip on" onclick="setSchedSec('ALL',this)" data-i18n-all>All</div>
      <div class="chip" onclick="setSchedSec('CAT:section',this)">Sections</div>
      <div class="chip" onclick="setSchedSec('CAT:machine',this)">Machines</div>
      <div class="chip" onclick="setSchedSec('CAT:responsibility',this)">Responsibility</div>
      <div class="chip" onclick="setSchedSec('CAT:designation',this)">Designation</div>
      <div class="chip" onclick="setSchedSec('CAT:name',this)">Name</div>
    </div>
    <div class="chips" id="schedFilterSecondary" style="display:none;margin-top:6px;flex-wrap:wrap;gap:6px"></div>
    <!-- External date header disabled — dates are in table thead -->
    <div id="schedDateHdrWrap" style="display:none!important">
      <div id="schedHdrStack"><div id="schedMonthHdr"></div><div id="schedDateHdr"></div></div>
    </div>
  </div><!-- end sched-sticky-hdr -->
  <div class="sched-wrap" id="schedWrap" role="region" aria-label="Schedule grid" tabindex="0"><table class="sched-tbl" id="schedTbl" role="grid" aria-label="Shift schedule"></table></div>
  <!-- Day strip + legend shown below table -->
  <div style="margin-top:10px">
    <div class="legend" id="schedLegend"></div>
  </div>

  <!-- ══ SHIFT TRENDS SECTION ══ -->
  <div id="shiftTrendsSection" style="margin-top:16px">
    <!-- Rendered by renderShiftTrends() after renderSchedule() -->
  </div>

  <!-- ══ MULTI-CELL SELECT BAR ══ -->
  <div id="multiSelectBar">
    <span class="ms-count" id="msCount">0 cells</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:6px">
      <button type="button" class="ms-btn" style="background:#0f766e;color:#fff;font-weight:800" onclick="copySchedSelection()" title="Ctrl+C">📋 Copy</button>
      <button type="button" class="ms-btn" style="background:#1d4ed8;color:#fff;font-weight:800" onclick="pasteSchedSelection()" title="Ctrl+V">📌 Paste</button>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center">
      <button class="ms-btn ms-shift-dn" data-shift="D" style="background:#f59e0b;color:#000" onclick="applyMultiShift('D')">D</button>
      <button class="ms-btn ms-shift-dn" data-shift="N" style="background:#4f46e5;color:#fff" onclick="applyMultiShift('N')">N</button>
      <button class="ms-btn ms-shift-abc" data-shift="A" style="background:#16a34a;color:#fff" onclick="applyMultiShift('A')">A</button>
      <button class="ms-btn ms-shift-abc" data-shift="B" style="background:#db2777;color:#fff" onclick="applyMultiShift('B')">B</button>
      <button class="ms-btn ms-shift-abc" data-shift="C" style="background:#0891b2;color:#fff" onclick="applyMultiShift('C')">C</button>
      <button class="ms-btn" style="background:#334155;color:#94a3b8" onclick="applyMultiShift('O')">O</button>
      <button class="ms-btn" style="background:#be123c;color:#fda4af" onclick="applyMultiShift('L')">L</button>
      <button class="ms-btn" style="background:#0c4a6e;color:#7dd3fc" onclick="applyMultiShift('G')">G</button>
      <button class="ms-btn" style="background:#713f12;color:#fde68a" onclick="applyMultiShift('C/O')" style="font-size:10px">CO</button>
      <button class="ms-btn" style="background:#f97316;color:#fff" onclick="applyMultiShift('HLF')">½</button>
      <button class="ms-btn" style="background:#7f1d1d;color:#fca5a5" onclick="applyMultiShift('Ab')" style="font-size:10px">Ab</button>
      <button class="ms-btn" style="background:#ea580c;color:#fff" onclick="applyMultiShift('H')">H</button>
    </div>
    <button type="button" class="ms-cancel" id="msCancelBtn"
      ontouchstart="event.stopPropagation();clearMultiSelect();" onclick="clearMultiSelect();"
      aria-label="Cancel multi-select">✕ Cancel</button>
  </div>

  <!-- ══ PENDING CHANGES SAVE BAR ══ -->
  <div id="schedSaveBar" style="display:none;position:sticky;bottom:0;left:0;right:0;
    background:linear-gradient(135deg,#0d2a1a,#0a1f14);
    border-top:2px solid rgba(34,197,94,.4);
    padding:14px 16px;margin:0 -16px;
    box-shadow:0 -6px 24px rgba(0,0,0,.5);z-index:95">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:14px;font-weight:900;color:var(--green)" id="saveBarTitle">📝 Changes pending</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:2px" id="saveBarSub"></div>
      </div>
      <button onclick="discardAllShiftChanges()" style="padding:7px 12px;border-radius:8px;border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.08);color:var(--lv);font-size:12px;font-weight:700;cursor:pointer">
        ✕ Cancel
      </button>
    </div>
    <!-- Pending changes list -->
    <div id="saveBarList" style="max-height:120px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:6px"></div>
    <!-- Save button -->
    <button onclick="saveAllShiftChanges()" style="width:100%;padding:16px;border-radius:13px;border:none;
      background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;
      font-family:'Noto Sans Devanagari',sans-serif;font-size:17px;font-weight:900;
      cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.4);
      display:flex;align-items:center;justify-content:center;gap:10px">
      💾 Save
    </button>
  </div>
</div>
