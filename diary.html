<!-- ── WORK DIARY (personal per mobile) ── -->
<div class="tab" id="tab-diary">
  <div class="page-title" style="margin-bottom:4px">📔 Work Diary</div>
  <div class="page-sub" style="margin-bottom:12px" data-i18n-diary-sub>Date-wise personal diary · only you can see it</div>

  <!-- Search -->
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <input type="search" id="wdSearchInput" placeholder="Search in your diaries…"
      style="flex:1;min-width:160px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);color:var(--text);font-size:14px;font-weight:600"
      onkeydown="if(event.key==='Enter'){event.preventDefault();wdRunSearch();}">
    <button type="button" class="act-btn" onclick="wdRunSearch()"
      style="padding:10px 16px;border-radius:12px;border:none;background:#2563eb;color:#fff;font-weight:800;cursor:pointer">🔍 Search</button>
    <button type="button" class="act-btn" onclick="wdClearSearch()"
      style="padding:10px 12px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);color:var(--text);font-weight:700;cursor:pointer">Clear</button>
  </div>
  <div id="wdSearchResults" style="display:none;margin-bottom:14px"></div>

  <!-- A4 diary page -->
  <div id="wdPage" class="wd-a4" style="max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:18px 18px 22px;box-shadow:0 8px 28px rgba(0,0,0,.12)">
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--border2)">
      <div>
        <label style="font-size:11px;font-weight:800;color:var(--muted2);display:block;margin-bottom:4px">Date</label>
        <div style="display:flex;align-items:center;gap:6px">
          <button type="button" id="wdPrevDay" onclick="wdShiftDate(-1)" title="Previous day" aria-label="Previous day"
            style="width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border2);background:var(--card);color:var(--text);font-size:20px;font-weight:800;cursor:pointer;line-height:1;flex-shrink:0">‹</button>
          <input type="date" id="wdDate" onchange="wdOnDateChange()"
            style="padding:8px 12px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);font-weight:700;min-width:0">
          <button type="button" id="wdNextDay" onclick="wdShiftDate(1)" title="Next day" aria-label="Next day"
            style="width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border2);background:var(--card);color:var(--text);font-size:20px;font-weight:800;cursor:pointer;line-height:1;flex-shrink:0">›</button>
        </div>
      </div>
      <div>
        <label style="font-size:11px;font-weight:800;color:var(--muted2);display:block;margin-bottom:4px">Day</label>
        <div id="wdDay" style="padding:8px 12px;border-radius:10px;background:rgba(37,99,235,.1);color:#2563eb;font-weight:800;min-width:100px">—</div>
      </div>
      <div style="flex:1;min-width:140px">
        <label style="font-size:11px;font-weight:800;color:var(--muted2);display:block;margin-bottom:4px">Shift (from schedule)</label>
        <div id="wdShift" style="padding:8px 12px;border-radius:10px;background:rgba(34,197,94,.1);color:#16a34a;font-weight:800">—</div>
      </div>
    </div>

    <div style="font-size:12px;font-weight:800;color:var(--muted2);margin-bottom:10px">
      Time slots — type notes and/or draw with finger or mouse
    </div>

    <!-- Each block: From–To + notes for that slot -->
    <div id="wdSlots"></div>
    <!-- Add-slot button is under each slot's notes (see JS) so no scroll-up needed -->

    <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
      <button type="button" onclick="wdSave()"
        style="flex:1;min-width:120px;padding:14px;border-radius:12px;border:none;background:#16a34a;color:#fff;font-weight:900;font-size:15px;cursor:pointer">💾 Save diary</button>
      <button type="button" onclick="wdNewToday()"
        style="padding:14px 16px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);color:var(--text);font-weight:800;cursor:pointer">Today</button>
    </div>
    <div id="wdStatus" style="margin-top:10px;font-size:12px;font-weight:700;color:var(--muted2)">Notes auto-save while you type</div>

    <!-- Word download: this day or date range -->
    <div style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--border2)">
      <div style="font-size:13px;font-weight:900;color:var(--text);margin-bottom:8px">📄 Download Word</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end">
        <div>
          <label style="font-size:10px;font-weight:700;color:var(--muted2)">From</label>
          <input type="date" id="wdDocFrom" style="display:block;padding:8px 10px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);font-weight:700">
        </div>
        <div>
          <label style="font-size:10px;font-weight:700;color:var(--muted2)">To</label>
          <input type="date" id="wdDocTo" style="display:block;padding:8px 10px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);font-weight:700">
        </div>
        <button type="button" onclick="wdDownloadWord('day')"
          style="padding:10px 14px;border-radius:10px;border:none;background:#1d4ed8;color:#fff;font-weight:800;cursor:pointer">This day</button>
        <button type="button" onclick="wdDownloadWord('range')"
          style="padding:10px 14px;border-radius:10px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer">Date range</button>
      </div>
      <div style="font-size:11px;color:var(--muted2);margin-top:6px">Word file (.doc) — only your diary. Range inclusive.</div>
    </div>
  </div>
</div>
<style>
.wd-block{
  margin-bottom:16px;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border2);
  background:var(--bg2);
}
.wd-block-head{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:10px;
}
.wd-block-head input[type="time"]{
  padding:8px 10px;border-radius:10px;border:1.5px solid var(--border2);
  background:var(--card);color:var(--text);font-weight:700;width:100%;box-sizing:border-box;
}
.wd-block-notes{
  min-height:120px;max-height:40vh;overflow:auto;
  padding:12px;border-radius:12px;border:1.5px solid var(--border2);
  background:var(--card);color:var(--text);font-size:15px;line-height:1.55;
  outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation;
}
.wd-block-notes:empty:before{
  content:attr(data-placeholder);color:var(--muted2);font-weight:500;
}
.wd-hit{padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--card);margin-bottom:8px;cursor:pointer}
.wd-hit:hover{border-color:#2563eb}
@media print{
  .nb,.pc-sidebar,#mainNav,#mainHdr,.wd-a4 button,#wdSearchInput{display:none!important}
  .wd-a4{box-shadow:none!important;border:none!important;max-width:100%!important}
}
</style>
