<section class="tab wd-workspace" id="tab-diary" aria-labelledby="wdTitle">
  <header class="wd-heading wd-screen-only">
    <h1 id="wdTitle" data-wd-hi="कार्य डायरी">Work Diary</h1>
    <div id="wdModeBar" class="wd-mode-bar" role="group" aria-label="Work Diary views" data-wd-hi-label="कार्य डायरी के दृश्य">
      <button type="button" class="wd-mode-btn active" data-wd-mode="diary" data-wd-hi="डायरी" aria-pressed="true" aria-controls="wdDiaryPanel" onclick="wdSetMode('diary')">Diary</button>
      <button type="button" class="wd-mode-btn" data-wd-mode="notes" data-wd-hi="नोट्स" aria-pressed="false" aria-controls="wdNotesPanel" onclick="wdSetMode('notes')">Notes</button>
      <button type="button" class="wd-mode-btn" data-wd-mode="calendar" data-wd-hi="कैलेंडर" aria-pressed="false" aria-controls="wdCalPanel" onclick="wdSetMode('calendar')">Calendar</button>
    </div>
      <div class="wd-toolbar wd-diary-tools wd-screen-only" data-enter-scope>
        <div class="wd-date-tools">
          <button type="button" id="wdPrevDay" onclick="wdShiftDate(-1)" title="Previous day" aria-label="Previous day" data-wd-hi-label="पिछला दिन"><span aria-hidden="true">‹</span></button>
          <input type="date" id="wdDate" onchange="wdOnDateChange()" aria-label="Diary date" data-wd-hi-label="डायरी की तारीख">
          <button type="button" id="wdNextDay" onclick="wdShiftDate(1)" title="Next day" aria-label="Next day" data-wd-hi-label="अगला दिन"><span aria-hidden="true">›</span></button>
          <button type="button" onclick="wdNewToday()" data-wd-hi="आज">Today</button>
        </div>
        <div class="wd-actions">
          <button type="button" id="wdUndo" onclick="wdTextUndo(false,false)" title="Undo text" aria-label="Undo text" data-wd-hi-label="लेखन वापस लें" disabled>↶</button>
          <button type="button" id="wdRedo" onclick="wdTextUndo(false,true)" title="Redo text" aria-label="Redo text" data-wd-hi-label="लेखन फिर करें" disabled>↷</button>
          <button type="button" id="wdSaveBtn" data-enter-action class="wd-primary" onclick="wdSave()" title="Save diary" aria-label="Save diary" data-wd-hi-label="डायरी सहेजें" data-wd-hi="सहेजें">Save</button>
          <button type="button" onclick="wdPrint()" title="Print" aria-label="Print" data-wd-hi-label="प्रिंट">⎙</button>
          <button type="button" id="wdSearchToggle" aria-expanded="false" aria-controls="wdSearchForm"
            aria-label="Search diaries" title="Search diaries" data-wd-hi-label="डायरी खोजें" onclick="wdToggleSearch()"><span aria-hidden="true">⌕</span></button>
          <details class="wd-export">
            <summary title="Export Word" aria-label="Export Word" data-wd-hi-label="Word डाउनलोड">Word</summary>
            <div class="wd-export-panel">
              <button type="button" onclick="wdDownloadWord('day')" data-wd-hi="इस दिन का Word">Download this day</button>
              <div class="wd-fields">
                <label for="wdDocFrom"><span data-wd-hi="से">From</span><input type="date" id="wdDocFrom"></label>
                <label for="wdDocTo"><span data-wd-hi="तक">To</span><input type="date" id="wdDocTo"></label>
              </div>
              <button type="button" onclick="wdDownloadWord('range')" data-wd-hi="तारीख सीमा का Word">Download date range</button>
            </div>
          </details>
        </div>
      </div>
  </header>

  <div class="wd-scroll" id="wdScroll">
    <div id="wdDiaryPanel" class="wd-panel">


      <form id="wdSearchForm" class="wd-search wd-screen-only" hidden onsubmit="event.preventDefault();wdRunSearch()">
        <input type="search" id="wdSearchInput" placeholder="Search your diaries…" aria-label="Search your diaries" data-wd-hi-placeholder="अपनी डायरी खोजें…" data-wd-hi-label="अपनी डायरी खोजें">
        <button type="submit" data-wd-hi="खोजें">Search</button>
        <button type="button" onclick="wdClearSearch()" data-wd-hi="साफ़ करें">Clear</button>
      </form>
      <div id="wdSearchResults" class="wd-screen-only" role="region" aria-label="Diary search results" data-wd-hi-label="डायरी के खोज परिणाम" hidden></div>

      <div id="wdPage" class="wd-a4">
        <div class="wd-page-meta">
          <div class="wd-entry-date"><time id="wdDisplayDate"></time><span id="wdDay">—</span></div>
          <div class="wd-shift"><span data-wd-hi="शिफ्ट">Shift</span><strong id="wdShift">—</strong></div>
          <span id="wdStatus" class="wd-screen-only" role="status"></span>
        </div>
        <div id="wdSlots" aria-busy="false" aria-label="Time slots" data-wd-hi-label="समय खंड"></div>
      </div>
    </div>

    <div id="wdNotesPanel" class="wd-panel" hidden>
      <aside id="wnLibrary" class="wn-library" aria-label="Notes list" data-wd-hi-label="नोट्स सूची">
        <div class="wd-search">
          <input type="search" id="wnSearch" placeholder="Search notes…" aria-label="Search notes" data-wd-hi-placeholder="नोट्स खोजें…" data-wd-hi-label="नोट्स खोजें" oninput="wnRenderList()">
          <button type="button" class="wd-primary" onclick="wnOpenEditor()" data-wd-hi="＋ नया नोट">＋ New note</button>
          <button type="button" id="wnResume" onclick="wnToggleList()" data-wd-hi="लेखन जारी रखें" hidden>Resume editing</button>
        </div>
        <div id="wnGrid"></div>
        <p id="wnEmpty" class="wd-empty" data-wd-hi="कोई नोट नहीं मिला। नया नोट जोड़ें।" hidden>No notes found. Add a new note.</p>
      </aside>
      <div id="wnEditor" class="wd-editor" hidden>
        <input type="hidden" id="wnEditId">
        <div class="wd-actions wn-editor-tools">
          <button type="button" id="wnListToggle" aria-controls="wnLibrary" aria-expanded="true" onclick="wnToggleList()">Hide notes list</button>
          <label for="wnTitle" class="wn-title-field"><span data-wd-hi="शीर्षक">Title</span><input type="text" id="wnTitle"></label>
        </div>
        <div class="wd-actions wn-format-tools">
          <button type="button" id="wnUndo" onclick="wdTextUndo(true,false)" title="Undo text" aria-label="Undo text" data-wd-hi-label="लेखन वापस लें" disabled>↶</button>
          <button type="button" id="wnRedo" onclick="wdTextUndo(true,true)" title="Redo text" aria-label="Redo text" data-wd-hi-label="लेखन फिर करें" disabled>↷</button>
          <button type="button" data-wd-hi="बोल्ड" onpointerdown="event.preventDefault()" onclick="wnFormat('bold')">Bold</button>
          <button type="button" data-wd-hi="इटैलिक" onpointerdown="event.preventDefault()" onclick="wnFormat('italic')">Italic</button>
          <button type="button" data-wd-hi="सूची" onpointerdown="event.preventDefault()" onclick="wnFormat('insertUnorderedList')">List</button>
          <details class="wn-options">
            <summary aria-label="Colour and pin" title="Colour and pin" data-wd-hi-label="रंग और पिन" data-wd-hi="रंग">Colour</summary>
            <div class="wd-note-options">
              <div id="wnColorRow" class="wd-swatch-row"></div>
              <label class="wd-check"><input type="checkbox" id="wnPinned"><span data-wd-hi="पिन करें">Pin</span></label>
            </div>
          </details>
        </div>
        <div id="wnBody" class="wd-note-body" role="textbox" aria-multiline="true" aria-label="Note" data-wd-hi-label="नोट" contenteditable="true" spellcheck="true"></div>
        <div class="wd-actions wn-editor-footer">
          <button type="button" class="wd-primary" data-enter-action onclick="wnSave()" data-wd-hi="सहेजें">Save</button>
          <button type="button" onclick="wnCloseEditor()" data-wd-hi="बंद करें">Close</button>
          <button type="button" id="wnDeleteBtn" class="wd-delete" onclick="wnDelete()" data-wd-hi="हटाएँ" hidden>Delete</button>
          <span id="wnStatus" role="status"></span>
        </div>
      </div>
    </div>

    <div id="wdCalPanel" class="wd-panel" hidden>
      <div class="wd-actions wd-toolbar">
        <button type="button" class="wd-primary" onclick="wcOpenEditor()" data-wd-hi="＋ इवेंट या रिमाइंडर">＋ Add event or reminder</button>
        <button type="button" onclick="wcRequestNotifPermission()" data-wd-hi="सूचनाओं की अनुमति दें">Allow notifications</button>
      </div>
      <div id="wcEditor" class="wd-editor" hidden>
        <input type="hidden" id="wcEditId">
        <label for="wcTitle"><span data-wd-hi="शीर्षक *">Title *</span><input type="text" id="wcTitle"></label>
        <div class="wd-fields">
          <label for="wcDate"><span data-wd-hi="तारीख *">Date *</span><input type="date" id="wcDate"></label>
          <label for="wcTime"><span data-wd-hi="समय *">Time *</span><input type="time" id="wcTime"></label>
        </div>
        <label for="wcNotes"><span data-wd-hi="नोट्स">Notes</span><textarea id="wcNotes" rows="4"></textarea></label>
        <label for="wcRemind"><span data-wd-hi="याद दिलाएँ">Remind me</span>
          <select id="wcRemind">
            <option value="0" data-wd-hi="इवेंट के समय">At event time</option>
            <option value="5" data-wd-hi="5 मिनट पहले">5 minutes before</option>
            <option value="15" data-wd-hi="15 मिनट पहले" selected>15 minutes before</option>
            <option value="30" data-wd-hi="30 मिनट पहले">30 minutes before</option>
            <option value="60" data-wd-hi="1 घंटा पहले">1 hour before</option>
            <option value="1440" data-wd-hi="1 दिन पहले">1 day before</option>
          </select>
        </label>
        <div class="wd-actions">
          <button type="button" class="wd-primary" data-enter-action onclick="wcSave()" data-wd-hi="सहेजें">Save</button>
          <button type="button" onclick="wcCloseEditor()" data-wd-hi="बंद करें">Close</button>
          <button type="button" id="wcDeleteBtn" class="wd-delete" onclick="wcDelete()" data-wd-hi="हटाएँ" hidden>Delete</button>
        </div>
        <div id="wcStatus" role="status"></div>
      </div>
      <div id="wcList"></div>
      <p id="wcEmpty" class="wd-empty" data-wd-hi="अभी कोई इवेंट या रिमाइंडर नहीं है।" hidden>No events or reminders yet.</p>
    </div>
  </div>
</section>
