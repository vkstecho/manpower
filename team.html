<!-- ── TEAM ── -->
<div class="tab" id="tab-team">
  <div class="page-title" id="pageTitleTeam">टीम</div>
  <div id="adminTeamHierarchyBlock" style="display:none">
    <div style="font-size:12px;font-weight:800;color:#22c55e;letter-spacing:.5px;margin:0 0 8px">
      &#127959;&#65039; MANAGERS &amp; उनकी TEAMS (Mobile Registration)
    </div>
    <div id="adminTeamHierarchySection"><div class="empty-text" style="padding:12px;font-size:12px">Loading...</div></div>
    <div style="font-size:12px;font-weight:800;color:#94a3b8;letter-spacing:.5px;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border2)">
      &#128100; कर्मचारी (Employee Code System)
    </div>
  </div>
  <div id="teamAddBtn"></div>
  <div class="search-box">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" placeholder="नाम या कोड से खोजें..." oninput="renderTeam(this.value)">
  </div>
  <div class="chips" id="teamFilter">
    <div class="chip on" onclick="setTeamSec('ALL',this)" data-i18n-all>सभी</div>
    <div class="chip" onclick="setTeamSec('M1',this)">M-1</div>
    <div class="chip" onclick="setTeamSec('M2',this)">M-2</div>
    <div class="chip" onclick="setTeamSec('S1',this)">Slitter-1</div>
    <div class="chip" onclick="setTeamSec('S2',this)">Slitter-2</div>
    <div class="chip" onclick="setTeamSec('SUP',this)">Supervisor</div>
    <div class="chip" onclick="setTeamSec('MGR',this)">Manager</div>
  </div>
  <div id="teamList"></div>

  <!-- Left Members Section (Admin only) -->
  <div id="leftMembersSection" style="display:none;margin-top:8px">
    <div onclick="toggleLeftMembers()" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border:1px solid rgba(244,63,94,.25);border-radius:12px;cursor:pointer;margin-bottom:2px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">🚪</span>
        <div>
          <div style="font-size:13px;font-weight:800;color:#f43f5e">Left Members</div>
          <div style="font-size:10px;color:var(--muted)">जो कर्मचारी टीम छोड़ चुके हैं</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="leftMemberCount" style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#f43f5e;background:rgba(244,63,94,.12);padding:2px 10px;border-radius:6px">0</span>
        <span id="leftMembersToggleIcon" style="color:var(--muted);font-size:16px">▼</span>
      </div>
    </div>
    <div id="leftMembersList" style="display:none;margin-top:4px"></div>
  </div>

  <!-- ══ SALARY COST CALCULATOR — Admin only ══ -->
  <div id="salaryCostSection" style="display:none;margin-top:16px">
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div>
        <div style="font-size:16px;font-weight:900;color:var(--text)">💰 Manpower Cost</div>
        <div style="font-size:11px;color:var(--muted2);margin-top:2px">Salary − Absent deductions</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="month" id="salaryCostMonth"
          style="background:var(--card);border:1px solid var(--border2);border-radius:8px;
          padding:6px 10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer"
          onchange="renderSalaryCost()">
        <button onclick="exportSalaryCost()"
          style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:8px;
          padding:6px 12px;color:var(--green);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">
          📤 Export
        </button>
      </div>
    </div>
    <!-- Summary cards -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center">
        <div id="scTotalGross" style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#fbbf24">—</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;font-weight:700;letter-spacing:.3px">GROSS SALARY</div>
      </div>
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center">
        <div id="scTotalDeduct" style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--lv)">—</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;font-weight:700;letter-spacing:.3px">DEDUCTIONS</div>
      </div>
      <div style="background:var(--panel);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:12px 8px;text-align:center">
        <div id="scTotalNet" style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--green)">—</div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px;font-weight:700;letter-spacing:.3px">NET PAYABLE</div>
      </div>
    </div>
    <!-- Detail table -->
    <div id="salaryCostTable" style="background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden">
      <div style="padding:20px;text-align:center;color:var(--muted2);font-size:13px">
        ऊपर Month चुनें
      </div>
    </div>
  </div>
</div>
