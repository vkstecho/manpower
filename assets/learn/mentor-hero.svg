  <rect x="214" y="134" width="212" height="110" rx="4" fill="#1e293b"/>
  <rect x="230" y="150" width="80" height="8" rx="4" fill="#a5b4fc"/>
  <rect x="230" y="168" width="160" height="6" rx="3" fill="#475569"/>
  <rect x="230" y="182" width="140" height="6" rx="3" fill="#475569"/>
  <rect x="230" y="196" width="100" height="6" rx="3" fill="#6366f1"/>
  <rect x="300" y="270" width="40" height="12" fill="#312e81"/>
  <!-- mentor person left -->
  <circle cx="140" cy="200" r="28" fill="#fbbf24"/>
  <rect x="118" y="230" width="44" height="55" rx="12" fill="#f59e0b"/>
