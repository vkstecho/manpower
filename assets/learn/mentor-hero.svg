    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  </defs>
  <rect width="640" height="400" rx="32" fill="url(#mbg)"/>
  <!-- desk -->
  <rect x="80" y="280" width="480" height="16" rx="4" fill="#4338ca" opacity=".5"/>
  <!-- monitor -->
