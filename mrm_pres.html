<style>
:root{--bg:#0a0f1a;--sf:#111825;--tx:#e2e8f0;--tx2:#94a3b8;--bd:rgba(255,255,255,.08);--ac:#ef4444;--r:12px;--fn:'DM Sans',sans-serif;--mn:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh}
.hd{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 16px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:18px;font-weight:800;color:#ef4444}
.hd p{font-size:11px;color:var(--tx2)}
.ct{padding:16px;max-width:600px;margin:0 auto}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ct2{font-size:14px;font-weight:700;margin-bottom:10px}
select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:8px;font-family:var(--fn);font-size:13px;width:100%}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--r);font-family:var(--fn);font-size:15px;font-weight:700;cursor:pointer}
.bp{background:linear-gradient(135deg,#ef4444,#f59e0b);color:#fff}
.bp:disabled{opacity:.5}
.status{font-size:12px;color:var(--tx2);margin-top:8px;text-align:center}
.months{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.months span{padding:4px 10px;border-radius:6px;font-size:11px;font-family:var(--mn);background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
</style>

const ML=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ml(mk){const[y,m]=mk.split('-');return ML[parseInt(m)-1]+'-'+y.slice(2)}
function mlf(mk){const[y,m]=mk.split('-');return ML[parseInt(m)-1]+' '+y}
function f(v,d){return typeof v==='number'?v.toFixed(d===undefined?2:d):'—'}

let metData={},metSettings={};
const FB_BASE='https://man-power-mp-default-rtdb.firebaseio.com';
function loadFromStorage(){
  try{const s=localStorage.getItem('metcost_saved_months');if(s){const p=JSON.parse(s);if(Object.keys(p).length>0)metData=p}}catch(e){}
  try{const s=localStorage.getItem('metcost_allSettings');if(s)metSettings=JSON.parse(s);
    else{const r=localStorage.getItem('metcost_rates');if(r)metSettings={rates:JSON.parse(r)}}}catch(e){}
}
async function fetchFromREST(){
  try{
    const resp=await fetch(FB_BASE+'/metcostData.json');
    if(!resp.ok) return false;
    const data=await resp.json();
    if(data&&Object.keys(data).length>0){
      metData=data;
      try{localStorage.setItem('metcost_saved_months',JSON.stringify(data))}catch(ex){}
      try{const sr=await fetch(FB_BASE+'/metcostSettings.json');if(sr.ok){const s=await sr.json();if(s){metSettings=s;try{localStorage.setItem('metcost_allSettings',JSON.stringify(s))}catch(ex){}}}}catch(ex){}
      return true;
    }
  }catch(ex){console.warn('[MRM] REST failed:',ex.message)}
  return false;
}
loadFromStorage();renderApp();
if(Object.keys(metData).length===0){
  fetchFromREST().then(ok=>{if(ok)renderApp()});
}

function renderApp(){
  const months=Object.keys(metData).sort().reverse();
  const app=document.getElementById('app');
  if(!months.length){
    app.innerHTML='<div class="cd"><div class="ct2">❌ No data found</div><p style="font-size:12px;color:var(--tx2);margin-bottom:12px">Open MetCost Pro first → upload files → Sync to Cloud → come back here.</p><button onclick="fetchFromREST().then(ok=>{if(ok)renderApp();else this.textContent=\'❌ Failed — check Firebase rules\'})" class="btn" style="background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)">🔄 Retry (fetch from cloud)</button></div>';return;
  }
  app.innerHTML=`<div class="cd"><div class="ct2">📊 Generate MRM Presentation</div>
    <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">${months.length} months available</p>
    <select id="selMonth">${months.map(m=>'<option value="'+m+'">'+mlf(m)+'</option>').join('')}</select>
    <div style="margin-top:14px"><button class="btn bp" onclick="generatePPT()" id="genBtn">📊 Generate PPT</button>
    <div class="status" id="status"></div></div></div>
    <div class="cd"><div class="ct2" style="font-size:12px">Available (${months.length})</div>
    <div class="months">${months.slice(0,24).map(m=>'<span>'+ml(m)+'</span>').join('')}</div></div>`;
}

async function generatePPT(){
  const mk=document.getElementById('selMonth').value;
  const btn=document.getElementById('genBtn'),stat=document.getElementById('status');
  btn.disabled=true;btn.textContent='⏳ Generating...';stat.textContent='';
  try{await _build(mk);stat.textContent='✅ Downloaded!';stat.style.color='#22c55e'}
  catch(err){stat.textContent='❌ '+err.message;stat.style.color='#ef4444';console.error(err)}
  btn.disabled=false;btn.textContent='📊 Generate PPT';
}

async function _build(mk){
  const d=metData[mk];if(!d)throw new Error('No data for '+mk);
  const r=(metSettings.rates)||{};
  const months=Object.keys(metData).sort();
  const mi=months.indexOf(mk);
  const m3=[months[mi-2],months[mi-1],mk].filter(Boolean);
  const m13=months.slice(Math.max(0,mi-12),mi+1);
  const[yr,mo]=mk.split('-');
  const monthShort=ML[parseInt(mo)-1]+'-'+yr.slice(2);
  const monthFull=ML[parseInt(mo)-1]+' '+yr;

  const P=new PptxGenJS();
  P.layout='LAYOUT_WIDE'; // 13.3×7.5
  P.author='MetCost Pro';P.title='Met Review '+monthFull;
  const C={dk:'1B2559',tl:'0D6E6E',wh:'FFFFFF',gy:'F5F5F5',rd:'DC2626',gn:'16A34A',tx:'1E293B',ltx:'64748B'};
  const hF='Calibri',bF='Calibri';
  const tb={pt:0.5,color:'CBD5E1'};
  const H=(cols)=>cols.map((t,i)=>({text:t,options:{fill:{color:C.dk},color:C.wh,bold:true,fontSize:13,align:i>0?'right':'center'}}));

  // ══ S1: TITLE — matching original dark blue + teal bar ══
  let s=P.addSlide();
  s.background={color:C.dk};
  // Teal accent bar at bottom
  s.addShape(P.shapes.RECTANGLE,{x:0,y:6.6,w:13.3,h:0.9,fill:{color:'0D9488'}});
  // Decorative circle
  s.addShape(P.shapes.OVAL,{x:2.2,y:2.0,w:2.4,h:2.4,fill:{color:'0D9488',transparency:70},line:{color:'0D9488',width:2}});
  // Logo
  s.addImage({data:GLS_LOGO_LG,x:0.4,y:0.3,w:1.5,h:1.1});
  // Title text
  s.addText('Metallizer Performance Review '+monthShort.toUpperCase(),{x:4,y:2.2,w:8.8,h:2,fontSize:40,fontFace:hF,color:C.wh,bold:true});
  s.addText('GLS Polyfilms · Metallizer Department',{x:4,y:4.5,w:8,h:0.6,fontSize:16,fontFace:bF,color:'94A3B8'});

  // ══ S2: Contents ══
  s=P.addSlide();s.background={color:C.wh};
  s.addImage({data:GLS_LOGO,x:0.3,y:0.2,w:1.2,h:0.8});
  s.addShape(P.shapes.RECTANGLE,{x:2.7,y:0.5,w:8,h:0.7,fill:{color:C.dk}});
  s.addText('Contents',{x:3,y:0.5,w:7,h:0.7,fontSize:24,fontFace:hF,color:C.wh,bold:true});
  ['Mixed Product Details','SB and Wastages','Monthly Performance Tracking','Wastage Trend','Down Gradation Trend','Downtime Summary','Conversion Cost Analysis','Target for Next Month'].forEach((c,i)=>{
    s.addText((i+1)+'.  '+c,{x:3.2,y:1.6+i*0.7,w:7,h:0.5,fontSize:18,fontFace:bF,color:C.tx});
  });

  // ══ S3: Mixed Product ══
  const za=d.zsAgg||{},byMat=za.byMaterial||[];
  s=P.addSlide();s.background={color:C.wh};
  s.addImage({data:GLS_LOGO,x:0,y:0,w:1.2,h:0.8});
  s.addText('Mixed Product Details',{x:1.7,y:0.1,w:10,h:0.8,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  const mic={};
  byMat.forEach(m=>{const c=(m.code||'').toUpperCase(),ds=m.desc||m.code||'';
    const mm=ds.match(/(\d+)µ/);let mc=mm?mm[1]:'12';
    if(c.match(/AL\d/))mc='AlOx';else if(c.includes('RC'))mc='RC';
    const om=ds.match(/([\d.]+)OD/);const od=om?om[1]:'2.2';
    if(!mic[mc])mic[mc]={};mic[mc][od]=(mic[mc][od]||0)+(m.kg||0)/1000;
  });
  const mxD=[H(['Micron/OD','2.2','2.5','2.8','Total (MT)','Equiv. (MT)'])];
  let gt=0;
  ['8','10','12','15','19','23','AlOx','RC'].forEach(mc=>{
    const ods=mic[mc]||{};const tot=['2.2','2.5','2.8'].reduce((s,od)=>s+(ods[od]||0),0);
    if(tot<0.01)return;gt+=tot;
    const lbl=mc==='AlOx'?'12 Mic. AlOx Coated':mc==='RC'?'12 Mic Release Coated':mc;
    mxD.push([lbl,...['2.2','2.5','2.8'].map(od=>f(ods[od]||0,1)),f(tot,1),'—'].map((t,i)=>({text:t,options:{fontSize:12,align:i>0?'right':'left',bold:i===0}})));
  });
  mxD.push(['Total','','','',f(gt,1),f(d.equivKg?d.equivKg/1000:gt,0)].map((t,i)=>({text:t,options:{fill:{color:'E2E8F0'},bold:true,fontSize:13,align:i>0?'right':'left'}})));
  s.addTable(mxD,{x:0.5,y:1.1,w:12.3,border:tb,colW:[3,1.7,1.7,1.7,2,2.2],rowH:0.55,autoPage:false});

  // ══ S4: Wastages ══
  s=P.addSlide();s.background={color:C.wh};
  s.addImage({data:GLS_LOGO,x:0,y:0,w:1.2,h:0.8});
  s.addText('SB and Wastages',{x:1.7,y:0,w:10,h:0.9,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  // B-grade remarks from zsAgg
  const bMats=(za.byMaterial||[]).filter(m=>(m.bKg||0)>0).sort((a,b)=>(b.bKg||0)-(a.bKg||0));
  const bRemarks=bMats.slice(0,5).map(m=>m.code+': '+f((m.bKg||0),0)+'Kg').join(', ');
  const wD=[H(['Wastages-SAP','MTD (MT)','MTD%','Target %','Deviation%']),
    ['Met Sheet Waste',f((d.metWasteKg||0)/1000,1),f(d.metWastePct,1),'1.0',f(-(d.metWastePct-1),1)],
    ['B Grade',f((d.slitBKg||0)/1000,1),f(d.bGradePct,1),'0',f(-d.bGradePct,1)],
  ].map((r,ri)=>ri===0?r:r.map((t,i)=>({text:t,options:{fontSize:13,align:i>0?'right':'left',color:i===4&&parseFloat(t)<0?C.rd:C.tx}})));
  s.addTable(wD,{x:0.3,y:1.5,w:12.7,border:tb,colW:[3.5,2.3,2.3,2.3,2.3],rowH:0.6});
  // B-grade remarks
  if(bRemarks){
    s.addText('B-Grade Remarks: '+bRemarks,{x:0.5,y:3.8,w:12,h:0.8,fontSize:14,fontFace:bF,color:C.ltx,italic:true});
  }

  // ══ S5: Monthly Tracking ══
  s=P.addSlide();s.background={color:C.wh};
  s.addText('Monthly Performance Tracking',{x:1.2,y:0.05,w:10.9,h:0.6,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  const pf=[
    {l:'Met Feed/Input (MT)',fn:dd=>(dd.prodKg||0)/1000,dp:1},
    {l:'Met Jumbo Production(MT)',fn:dd=>(dd.metJumboKg||dd.prodKg||0)/1000,dp:1},
    {l:'Slitting Output(MT)',fn:dd=>(dd.effectiveProd||0)/1000,dp:1},
    {l:'Met Waste Produced(%)',fn:dd=>dd.metWastePct||0,dp:2},
    {l:'B Grade Generated(%)',fn:dd=>dd.bGradePct||0,dp:1},
    {l:'Slitting Output Equivalent(MT)',fn:dd=>(dd.equivKg||0)/1000,dp:1},
    {l:'Run Days',fn:dd=>dd.runDays?dd.runDays.avg:0,dp:1},
    {l:'Al wire Consumption(Kg/MT)',fn:dd=>dd.prodMT?(dd.wireKgsTotal||0)/dd.prodMT:0,dp:1},
    {l:'Evaporation Boat(Pc/MT)',fn:dd=>dd.prodMT?(dd.boatPcsTotal||0)/dd.prodMT:0,dp:1},
    {l:'Power Consumption(UPT)',fn:dd=>dd.prodMT?(dd.pwrU||0)/dd.prodMT:0,dp:1},
    {l:'Average Width(MM)',fn:dd=>dd.odEq?dd.odEq.avgWidth:0,dp:0},
  ];
  const pR=[H(['Month',...m3.map(m=>ml(m))])];
  pf.forEach(pm=>{const row=[{text:pm.l,options:{fontSize:11,bold:false}}];
    m3.forEach(m=>{const dd=metData[m]||{};row.push({text:f(pm.fn(dd),pm.dp),options:{align:'right',fontSize:12,fontFace:'JetBrains Mono'}})});
    pR.push(row);
  });
  s.addTable(pR,{x:0.3,y:0.8,w:12.4,border:tb,colW:[5.5,...m3.map(()=>(12.4-5.5)/m3.length)],rowH:0.48,autoPage:false});

  // ══ S6: Waste Trend — LINE CHART with % ══
  s=P.addSlide();s.background={color:C.wh};
  s.addText('Wastage-Trend',{x:0.9,y:0.1,w:11.5,h:0.7,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  s.addShape(P.shapes.RECTANGLE,{x:0.9,y:0.85,w:2.5,h:0.08,fill:{color:'0D9488'}});
  const wLabels=m13.map(m=>ml(m));
  const wVals=m13.map(m=>parseFloat(((metData[m]||{}).metWastePct||0).toFixed(1)));
  s.addChart(P.charts.LINE,[{name:'% Waste',labels:wLabels,values:wVals}],
    {x:0.3,y:1.3,w:12.7,h:5.5,showValue:true,valueFontSize:10,catAxisLabelFontSize:10,valAxisLabelFontSize:10,
      lineDataSymbol:'circle',lineDataSymbolSize:8,chartColors:['0D9488'],lineSize:3,
      showTitle:true,title:'% Non Usable Waste Generated (Met Sheet + Trim + Offcut)',titleFontSize:13,titleColor:C.tx,
      valAxisMinVal:0});

  // ══ S7: B-Grade Trend — LINE CHART with % ══
  s=P.addSlide();s.background={color:C.wh};
  s.addText('Down Gradation Trend',{x:0.9,y:0.1,w:11.5,h:0.7,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  const bVals=m13.map(m=>parseFloat(((metData[m]||{}).bGradePct||0).toFixed(1)));
  s.addChart(P.charts.LINE,[{name:'% Down Gradation',labels:wLabels,values:bVals}],
    {x:0.3,y:1.3,w:12.7,h:5.5,showValue:true,valueFontSize:10,catAxisLabelFontSize:10,valAxisLabelFontSize:10,
      lineDataSymbol:'circle',lineDataSymbolSize:8,chartColors:[C.rd],lineSize:3,
      showTitle:true,title:'% Down Gradation (B + 3rd Grade)',titleFontSize:13,titleColor:C.tx,
      valAxisMinVal:0});

  // ══ S8: Downtime ══
  s=P.addSlide();s.background={color:C.wh};
  s.addText('Downtime Summary in Hours',{x:3.3,y:0,w:6.7,h:0.8,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  const rd=d.runDays||{};
  const dtR=[H(['Machine','Met-1','Met-2','Total']),
    ['Total Stop (hrs)',f((rd.m1Stop||0)*24,1),f((rd.m2Stop||0)*24,1),f(((rd.m1Stop||0)+(rd.m2Stop||0))*24,1)],
    ['Power Downtime',f((rd.m1PwrStop||0)*24,1),f((rd.m2PwrStop||0)*24,1),f(((rd.m1PwrStop||0)+(rd.m2PwrStop||0))*24,1)],
    ['Run Days',f(rd.m1||0,1),f(rd.m2||0,1),f(rd.avg||0,1)],
    ['Rolls/Day',f(rd.m1RollsPerDay||0,1),f(rd.m2RollsPerDay||0,1),f(rd.avgRollsPerDay||0,1)],
  ].map((r,ri)=>ri===0?r:r.map((t,i)=>({text:t,options:{fontSize:13,align:i>0?'right':'left',bold:i===0}})));
  s.addTable(dtR,{x:0.4,y:1.0,w:12.5,border:tb,colW:[4,2.8,2.8,2.8],rowH:0.65});

  // ══ S9: Conversion Cost ══
  s=P.addSlide();s.background={color:C.wh};
  const e=d.eq||{};const tRM=(r.tWire||3.05)+(r.tBoat||1.87);
  const tConv=(r.tWaste||1)+(r.tManpower||0.8)+(r.tPower||3.56)+(r.tCons||0.3)+(r.indirectExpense||0.26);
  const cc=[ // [label,actual,equiv,target,bold,highlight]
    ['Conversion Cost:','Actual','Equivalent','Target '+(r.targetDate||''),true,'hdr'],
    ['Slit Production (Exc. 5&6 Grade)',f(d.effectiveProd||0,0),f(d.equivKg||0,0),''],
    ['Wastage % Slitter(Inc. 6 Grade)',f(d.metWastePct,2),f(e.metWPct||d.metWastePct,2),'1.00'],
    ['B Grade %',f(d.bGradePct,2),f(e.bGradePct||d.bGradePct,2),'0.00'],
    ['Bare Film Waste %',f(d.bareWastePct,2),f(e.bareWPct||d.bareWastePct,2),''],
    ['','Cost ₹/Kg','Cost ₹/Kg',''],
    ['Wire('+f((d.wireKgsTotal||0)/(d.prodMT||1),1)+' Kg/MT)',f(d.wireCKg),f(e.wire),f(r.tWire||3.05)],
    ['Boat('+f((d.boatPcsTotal||0)/(d.prodMT||1),1)+' Pc/MT)',f(d.boatCKg),f(e.boat),f(r.tBoat||1.87)],
    ['Raw Material Cost:',f(d.rmC),f(e.rm),f(tRM),true,'blue'],
    ['Conversion Cost:','','',''],
    ['Wastage(Bare+Met Film) Loss',f(d.wasteLoss),f(e.wasteLoss),f(r.tWaste||1)],
    ['B Grade (Loss)',f(d.bGradeLoss),f(e.bGradeLoss),'0.00'],
    ['Manpower',f(d.mpKg),f(e.mp),f(r.tManpower||0.8)],
    ['Power',f(d.pwrKg),f(e.pwr),f(r.tPower||3.56)],
    ['Cons & Spares',f(d.consKg),f(e.cons),f(r.tCons||0.3)],
    ['Indirect Expense',f(r.indirectExpense||0.26),f(r.indirectExpense||0.26),f(r.indirectExpense||0.26)],
    ['Conversion Cost',f(d.convC),f(e.convC),f(tConv),true,'blue'],
    ['Total Cost',f(d.totalC),f(e.totalC),f(tRM+tConv),true],
    ['Packing & Freight Cost',f(r.packingFreight||1.67),f(r.packingFreight||1.67),f(r.packingFreight||1.67)],
    ['Total Cost with Packing','₹'+f(d.totalWP),'₹'+f(e.totalWP),'₹'+f(tRM+tConv+(r.packingFreight||1.67)),true,'yellow'],
  ];
  const ccR=cc.map(row=>{
    if(row[5]==='hdr')return H(row.slice(0,4));
    const bg=row[5]==='blue'?{color:'E8F0FE'}:row[5]==='yellow'?{color:'FEF3C7'}:undefined;
    return row.slice(0,4).map((t,i)=>({text:t,options:{fontSize:12,align:i>0?'right':'left',bold:!!row[4],
      fill:bg,fontFace:i>0?'JetBrains Mono':bF}}));
  });
  s.addTable(ccR,{x:0.1,y:0.1,w:13,border:tb,colW:[4.5,2.8,2.8,2.8],rowH:0.36,autoPage:false});

  // ══ S10: Target ══
  s=P.addSlide();s.background={color:C.wh};
  const nMo=parseInt(mo)>=12?ML[0]+'-'+(parseInt(yr)+1):ML[parseInt(mo)]+'-'+yr;
  s.addText('Target for the Next Month of '+nMo,{x:0.7,y:0,w:12,h:0.9,fontSize:32,fontFace:hF,color:C.dk,bold:true});
  s.addTable([['Slitting Output(MT) (Equiv 12µ 2.2OD)','1875'],['Number of Run Days','25'],['Running Time (Hrs/Machine/Day) (10 Rolls, 1.5Hr/Roll)(2.2OD)','15.5'],['Met Waste(%)','1.0'],['B Grade Generation(%)','0.1'],['Overall Efficiency(%)','98.9']].map(r=>[{text:r[0],options:{fontSize:15,bold:true}},{text:r[1],options:{fontSize:16,align:'right',fontFace:'JetBrains Mono',bold:true,color:C.dk}}]),
    {x:0.4,y:1.2,w:12.5,border:tb,colW:[8.5,4],rowH:0.75});

  // ══ S11: Thanks — matching original ══
  s=P.addSlide();s.background={color:C.dk};
  s.addShape(P.shapes.RECTANGLE,{x:0,y:6.6,w:13.3,h:0.9,fill:{color:'0D9488'}});
  s.addShape(P.shapes.OVAL,{x:5,y:0.8,w:3.3,h:3.3,fill:{color:'0D9488',transparency:80},line:{color:'0D9488',width:2}});
  s.addImage({data:GLS_LOGO_LG,x:5.5,y:1.3,w:2.3,h:1.7});
  s.addText('Thanks',{x:2,y:4.8,w:9.3,h:1.5,fontSize:52,fontFace:hF,color:C.wh,bold:true,align:'center'});

  await P.writeFile({fileName:'Met_Presentation_'+monthFull.replace(' ','_')+'.pptx'});
}
